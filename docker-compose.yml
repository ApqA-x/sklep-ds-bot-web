services:
  mongo:
    image: mongo:7
    # локальный Windows-mongod занимает 27017 — наружу публикуем 27018
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo-data:/data/db

  web:
    build: .
    ports:
      # наружный порт на хосте можно сменить: WEB_HOST_PORT=8081 docker compose up
      - "127.0.0.1:${WEB_HOST_PORT:-8000}:8000"
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DB: ${MONGO_DB:-voice_tracker}
      # для проверки этапа 5 (бот-действия) — пусто = функция выключена
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      # для проверки этапа 3 (OAuth) — пусто = dev-режим без авторизации
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:-}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-}
      # картинки из чата: тот же external volume dsbot-media, куда gateway пишет
      # вложения (docker volume create dsbot-media — один раз на хосте)
      MEDIA_DIR: ${MEDIA_DIR:-/data/media}
    volumes:
      - dsbot-media:/data/media:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongo

volumes:
  mongo-data:
  dsbot-media:
    external: true

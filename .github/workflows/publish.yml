name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий тег vMAJOR.MINOR.PATCH для публикации (пройдёт тот же gate)"
        required: true

# R26-11/V26-26 (было T15/п.5 CI03): публикация только с SHA, который реально
# лежит в истории main и на котором ci.yml закончился зелёным. Оба гейта —
# через scripts/release_gate.py, а не gh api:
# - "SHA достижим из main" считаем по графу Git (`git merge-base --is-ancestor`);
#   gh api compare отдаёт ahead/behind как relative-статус ветки — двусмысленно;
# - зелёный CI решает самый СВЕЖИЙ run каждого обязательного job'а: старый green
#   не перекрывает свежий red rerun, а in_progress/cancelled/missing — не success.
# Ни тег из случайной ветки, ни ручной dispatch не обходят гейт — dispatch обязан
# назвать существующий тег, и он проверяется идентично.
# R26-11/V26-27: build пушит только кандидат ci-<SHA>; version/minor/latest
# навешивает job promote ПОСЛЕ smoke конкретного digest — провалившийся смоук
# больше не застанет latest уже сдвинутым. Ничего не удаляем: старые версии
# остаются в registry.

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sklep-ds-bot-web
  UV_VERSION: "0.12.19"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve tag -> commit
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "тег '$TAG' не похож на vMAJOR.MINOR.PATCH"; exit 1;;
          esac
          OBJ=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object')
          TYPE=$(echo "$OBJ" | jq -r .type)
          SHA=$(echo "$OBJ" | jq -r .sha)
          if [ "$TYPE" = "tag" ]; then
            SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" --jq .object.sha)
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "тег $TAG -> коммит $SHA"

      # полная история main: merge-base работает по настоящему графу (R26-11)
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: SHA достижим из main (граф Git, не gh compare)
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: python3 scripts/release_gate.py ancestry --candidate "$SHA"

      - name: CI на этом SHA прошёл зелёным (решает самый свежий run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          # обязательные job'ы ci.yml; список = --required одной строкой (п.6)
          gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" --paginate > /tmp/checks.json
          python3 scripts/release_gate.py conclusions --checks /tmp/checks.json --required api,integration,ui,ui-e2e

  # R26-11/V26-27: здесь только кандидатный тег ci-<полный SHA>. Публичные
  # version/minor/latest двигает promote после смоука этого digest.
  build:
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Candidate image ref
        id: tags
        run: |
          IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')  # GHCR требует lowercase
          echo "image_lc=$IMAGE_LC" >> "$GITHUB_OUTPUT"

      - name: Build and push candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.image_lc }}:ci-${{ needs.gate.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.gate.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # R26-11/V26-27 (было CI07): смоук опубликованного digest кандидата ci-<SHA>,
  # а не заново собранного checkout. Перед запуском сверяем OCI revision
  # манифеста с проверенным gate'ом SHA (не тот образ = не тот результат).
  # healthz=liveness: 200 только когда uvicorn реально поднялся на
  # locked-зависимостях (dev-режим конфига, своя одноразовая Mongo — приложение
  # при старте сверяет схему, поэтому без БД не стартует).
  smoke:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    services:
      mongo:
        image: mongo:7
        ports:
          - "27017:27017"
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke published candidate digest
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          DIGEST=$(docker buildx imagetools inspect "$IMAGE_LC:ci-$SHA" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "inspected $IMAGE_LC@$DIGEST"
          # build-push-action writes OCI labels to each platform image config.
          # `imagetools inspect -o` is not a supported buildx flag, and the
          # index manifest does not carry this revision annotation.
          REVISION=$(docker buildx imagetools inspect "$IMAGE_LC@$DIGEST" \
            --format '{{json .}}' | jq -r \
            '.image["linux/amd64"].config.Labels["org.opencontainers.image.revision"] // empty')
          if [ "$REVISION" != "$SHA" ]; then
            echo "OCI revision '$REVISION' != SHA кандидата '$SHA' — смоук не того образа"
            exit 1
          fi
          # host-сеть: контейнер видит service-mongo на 127.0.0.1 и наружу
          # отдаёт 8000 без bridge-манипуляций
          docker run -d --name smoke --platform linux/amd64 --network host \
            -e WEB_ENV=development -e MONGO_URI=mongodb://127.0.0.1:27017 \
            "$IMAGE_LC@$DIGEST"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/healthz || true)
            if [ "$CODE" = "200" ]; then echo "SMOKE-OK (healthz 200, attempt $i)"; exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

  # R26-11/V26-27: единственный шаг, двигающий публичные теги. Перетегирование
  # сервером (imagetools create) уже проверенного digest — без пересборки и без
  # git-тегов; latest по-прежнему только для релизных версий без дефиса.
  promote:
    needs: [gate, build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote candidate digest to release tags
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          DIGEST=$(docker buildx imagetools inspect "$IMAGE_LC:ci-$SHA" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          TARGETS=(-t "$IMAGE_LC:$VERSION" -t "$IMAGE_LC:${VERSION%.*}")
          case "$VERSION" in
            *-*) ;;  # пре-релиз: latest не трогаем
            *) TARGETS+=(-t "$IMAGE_LC:latest");;
          esac
          docker buildx imagetools create "${TARGETS[@]}" "$IMAGE_LC@$DIGEST"
          echo "$IMAGE_LC@$DIGEST -> ${TARGETS[*]}"

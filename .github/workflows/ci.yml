name: ci

# Тесты веба (api/tests) существовали, но не выполнялись нигде: publish.yml
# запускается только по тегу и сразу собирает образ. Здесь повторяются ровно те
# команды, которые идут в Dockerfile, чтобы CI ловил то же, что сломает релиз.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Зависимости API + тест-раннер
        run: pip install -r api/requirements.txt pytest httpx

      - name: pytest
        run: python -m pytest api/tests -q

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # npm ci заодно сверяет package.json с package-lock.json — рассинхрон
      # (типичный случай: добавили зависимость, лок не пересобрали) ломается здесь,
      # а не на сборке образа по тегу.
      - name: npm ci
        working-directory: ui
        run: npm ci

      # build = tsc && vite build
      - name: Сборка UI
        working-directory: ui
        run: npm run build
